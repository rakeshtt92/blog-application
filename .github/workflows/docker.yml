# File: .github/workflows/docker.yml
name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t rakeshtt/blog-application:latest .

          # Tag image safely with short SHA
          IMAGE_TAG=${GITHUB_SHA::7}   # first 7 characters of SHA
          echo "Tagging image as rakeshtt/blog-application:$IMAGE_TAG"
          docker tag rakeshtt/blog-application:latest rakeshtt/blog-application:$IMAGE_TAG

      # 4️⃣ Push Docker images
      - name: Push Docker images
        run: |
          docker push rakeshtt/blog-application:latest
          docker push rakeshtt/blog-application:$IMAGE_TAG